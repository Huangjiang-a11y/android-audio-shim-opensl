name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (arm64, API 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android NDK
        id: ndk
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BIN="toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          NDK=""
          if [ -d "$SDK/ndk" ]; then
            NDK="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          fi

          if [ -z "$NDK" ] || [ ! -x "$NDK/$BIN" ]; then
            echo "::notice::no usable preinstalled NDK, downloading r25c"
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
              https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            NDK="$RUNNER_TEMP/android-ndk-r25c"
          fi

          echo "path=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"
          "$NDK/$BIN" --version | head -n 1

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -la audio-shim.jar libaudioshim.so
          file libaudioshim.so
          unzip -t audio-shim.jar > /dev/null
          # both OpenSL ES directions must be present
          nm -D libaudioshim.so | grep -q Java_de_maxhenkel_shim_NativeAudio_open
          nm -D libaudioshim.so | grep -q Java_de_maxhenkel_shim_NativeAudio_available
          nm -D libaudioshim.so | grep -q Java_de_maxhenkel_shim_NativeAudioOutput_write2
          # AAudio must be gone
          ! strings libaudioshim.so | grep -qi aaudio
          echo "all checks passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-audio-shim-opensl
          path: |
            audio-shim.jar
            libaudioshim.so
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" audio-shim.jar libaudioshim.so --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              audio-shim.jar libaudioshim.so
          fi
